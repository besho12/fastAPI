[pytest]

pythonpath = .

testpaths = app/comparison_engine tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    integration: end-to-end tests that exercise real external/heavy services
        (the real Gemini API via app.extraction.ExtractionService, and/or the
        real local BAAI/bge-m3 model via app.embedding.EmbeddingService).
        These are automatically skipped (not failed) when the required
        credentials or model are not available in the current environment.
